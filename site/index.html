<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowing and Living the Self · Survey Dashboard</title>
  <meta name="description" content="Live results dashboard for the anonymous survey on self-understanding among adults aged 18–50 in Rwanda.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e9384'/%3E%3Ccircle cx='32' cy='26' r='10' fill='white'/%3E%3Cpath d='M14 52c3-10 10-15 18-15s15 5 18 15' fill='white'/%3E%3C/svg%3E">
  <script>
    // apply saved theme before first paint
    (function () { try { var t = localStorage.getItem("klts-theme") ||
      (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
  </script>
  <link rel="stylesheet" href="vendor/fa/css/all.min.css">
  <link rel="stylesheet" href="vendor/dataTables.dataTables.min.css">
  <link rel="stylesheet" href="vendor/buttons.dataTables.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-user-astronaut"></i></div>
      <div>
        <div class="brand-name">Knowing &amp; Living the Self</div>
        <div class="brand-sub">Survey results · Rwanda</div>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="filters" id="filters">
      <div class="filters-title"><i class="fa-solid fa-filter"></i> Dashboard filters</div>
      <label for="f-age">Age group</label>
      <select id="f-age"></select>
      <label for="f-act">Primary activity</label>
      <select id="f-act"></select>
      <label for="f-circ">Circumstances</label>
      <select id="f-circ"></select>
      <label>Submission date</label>
      <div class="date-row">
        <input type="date" id="f-from" aria-label="From date">
        <input type="date" id="f-to" aria-label="To date">
      </div>
      <div class="filter-status" id="filter-status"><i class="fa-regular fa-circle-check"></i> No filters active</div>
      <button class="btn-reset" id="btn-reset"><i class="fa-solid fa-rotate-left"></i> Reset filters</button>
    </div>

    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="btn-menu" title="Show or hide the menu" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
      <div class="crumbs"><span class="section" id="crumb-section">Overview</span><span class="title" id="crumb-title">Executive summary</span></div>
      <div class="top-actions">
        <span class="pill count num" id="n-badge" title="Analysed respondents matching the filters">–</span>
        <button class="pill" id="btn-labels" title="Show values on charts"><i class="fa-solid fa-tag"></i><span class="lbl">Labels</span></button>
        <button class="pill" id="btn-theme" title="Switch light / dark theme"><i class="fa-solid fa-moon"></i><span class="lbl">Dark</span></button>
        <button class="pill" id="btn-share" title="Copy a link to this view"><i class="fa-solid fa-share-nodes"></i><span class="lbl">Share</span></button>
        <button class="pill" id="btn-pdf" title="Print or save this page as PDF"><i class="fa-solid fa-file-pdf"></i><span class="lbl">PDF</span></button>
        <a class="pill" id="btn-csv" href="data/respondent_scores.csv" download title="Download the processed data (CSV)"><i class="fa-solid fa-download"></i><span class="lbl">Data</span></a>
      </div>
    </header>
    <div class="chips" id="chips"></div>
    <main class="content" id="content"><div class="loading"><div><i class="fa-solid fa-spinner fa-spin"></i> Loading survey data…</div></div></main>
    <footer class="page-foot" id="page-foot"></footer>
  </div>
  <div class="toast" id="toast"></div>

  <script src="vendor/jquery.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/dataTables.min.js"></script>
  <script src="vendor/dataTables.dataTables.min.js"></script>
  <script src="vendor/dataTables.buttons.min.js"></script>
  <script src="vendor/buttons.dataTables.min.js"></script>
  <script src="vendor/buttons.html5.min.js"></script>
  <script src="vendor/buttons.print.min.js"></script>
  <script src="vendor/buttons.colVis.min.js"></script>
  <script src="vendor/plotly.min.js"></script>
  <script src="data/dashboard.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
