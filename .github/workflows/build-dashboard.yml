name: Build dashboard

# Downloads the Microsoft Forms responses workbook (Excel on SharePoint), rebuilds
# the dashboard with R when the data (or the code) changed, and commits public/.
# Vercel then redeploys.
on:
  schedule:
    - cron: "*/5 * * * *"            # every 5 minutes (GitHub may delay runs by a few minutes)
  repository_dispatch:
    types: [new_response]           # optional instant trigger (e.g. Power Automate, see README)
  workflow_dispatch:                # "Run workflow" button
  push:
    branches: [main]
    paths:
      - "data/**"
      - "R/**"
      - "site/**"
      - "scripts/**"
      - "build_dashboard.R"
      - "DESCRIPTION"
      - ".github/workflows/build-dashboard.yml"

permissions:
  contents: write

concurrency:
  group: build-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      EXCEL_URL: ${{ secrets.EXCEL_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Download responses workbook from SharePoint
        id: src
        if: env.EXCEL_URL != ''
        continue-on-error: true   # a failed download keeps the last dashboard online
        run: bash scripts/fetch_excel.sh

      - name: Decide whether to rebuild
        id: decide
        run: |
          if [[ "${{ steps.src.outcome }}" == "failure" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not download the responses workbook; the current dashboard stays online."
            exit 0
          fi
          if [[ -z "$EXCEL_URL" ]] && ! ls data/*.xlsx data/*.xls data/*.csv >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add the EXCEL_URL secret (the SharePoint share link) to build the dashboard."
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.src.outputs.changed }}" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No new or edited responses — nothing to rebuild."
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.decide.outputs.build == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.decide.outputs.build == 'true'

      - name: Build dashboard with R
        if: steps.decide.outputs.build == 'true'
        env:
          SOURCE_HASH: ${{ steps.src.outputs.hash }}
          DATA_SOURCE: forms
        run: |
          if [[ -s .excel/responses.xlsx ]]; then
            Rscript build_dashboard.R .excel/responses.xlsx
          else
            Rscript build_dashboard.R
          fi

      - name: Commit the rebuilt dashboard
        if: steps.decide.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public
          if git diff --cached --quiet; then
            echo "Dashboard unchanged."
            exit 0
          fi
          N="$(jq '.meta.n_all' public/data/dashboard.json 2>/dev/null || echo '?')"
          git commit -m "Update dashboard: $N responses ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
